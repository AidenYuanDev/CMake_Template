name: CI

on:
  # 所有分支都构建：模板仓库的特性分支同样需要在合入前被验证
  push:
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 · ${{ matrix.os }} · ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # 单独验证默认构建：不开测试、不联网拉依赖，这是使用者拿到模板的第一手体验
  default-build:
    name: 默认构建（BUILD_TESTING=OFF）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run
        run: ./build/bin/YourProjectName
